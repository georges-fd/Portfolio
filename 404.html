<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Georges Daou</title>
    <!--
      GitHub Pages SPA fallback.
      GitHub Pages has no server-side rewrites, so a hard refresh / deep link to
      a client route (e.g. /Portfolio/projects/mappet) hits this 404 page.
      This script rewrites the path into a query string and redirects back to the
      app base; a companion script in index.html decodes it and restores the route.
      Technique: https://github.com/rafgraph/spa-github-pages
      pathSegmentsToKeep = 1 because the app is served from the /Portfolio/ subpath.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
